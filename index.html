<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axolotl Run 🌊</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b1d33; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Segoe UI", Ubuntu, Helvetica, Arial, sans-serif; }
  h1 { color: #ffb1c8; font-size: 22px; letter-spacing: 2px; margin: 14px 0 6px; }
  #wrap { position: relative; width: min(96vw, 800px); }
  canvas { width: 100%; display: block; border-radius: 14px;
    box-shadow: 0 8px 40px rgba(0,0,0,.5); touch-action: manipulation; }
  p.hint { color: #7fa8c9; font-size: 13px; margin: 10px 0 16px; text-align: center; }
  a { color: #ffb1c8; }
</style>
</head>
<body>
<h1>~ axolotl run ~</h1>
<div id="wrap"><canvas id="c" width="800" height="300"></canvas></div>
<p class="hint">space / tap to swim up &nbsp;·&nbsp; dodge the coral, duck the jellyfish<br>
made with 🩷 by <a href="https://github.com/sarinadfernandez-create">sarina</a></p>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 800, H = 300, GROUND = 252;

// ---------- state ----------
let mode = 'start';            // start | play | dead
let t = 0, speed = 4.2, dist = 0, score = 0, best = 0;
try { best = +localStorage.getItem('axo-best') || 0; } catch(e) {}

const axo = { x: 110, y: GROUND, vy: 0, w: 74, h: 34 };
let obstacles = [], bubbles = [], nextSpawn = 0;

function reset() {
  t = 0; speed = 4.2; dist = 0; score = 0;
  axo.y = GROUND; axo.vy = 0;
  obstacles = []; nextSpawn = 90;
}

// ---------- input ----------
function jump() {
  if (mode === 'start') { mode = 'play'; reset(); return; }
  if (mode === 'dead')  { mode = 'play'; reset(); return; }
  if (axo.y >= GROUND - 0.5) axo.vy = -11.6;
}
addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp') { e.preventDefault(); jump(); }
});
cv.addEventListener('pointerdown', jump);

// ---------- spawning ----------
function spawn() {
  const late = score > 250 && Math.random() < 0.3;
  if (late) {              // jellyfish — floats at head height, do NOT jump
    obstacles.push({ kind: 'jelly', x: W + 40, y: 165 + Math.random() * 20, r: 20, bob: Math.random() * 6 });
  } else {                 // coral cluster on the seafloor
    const h = 34 + Math.random() * 26, w = 30 + Math.random() * 22;
    obstacles.push({ kind: 'coral', x: W + 40, y: GROUND, w, h,
      hue: Math.random() < 0.5 ? '#ff7f66' : '#ff5e7e' });
  }
  nextSpawn = 55 + Math.random() * 65 + Math.max(0, 40 - speed * 4);
}

// ---------- collision ----------
function hit() {
  const ax = axo.x - 26, ay = axo.y - axo.h + 6, aw = 52, ah = axo.h - 8;
  for (const o of obstacles) {
    if (o.kind === 'coral') {
      const ox = o.x - o.w / 2 + 5, oy = o.y - o.h + 4, ow = o.w - 10, oh = o.h - 4;
      if (ax < ox + ow && ax + aw > ox && ay < oy + oh && ay + ah > oy) return true;
    } else {
      const jy = o.y + Math.sin(t / 14 + o.bob) * 8;
      const cx = Math.max(ax, Math.min(o.x, ax + aw)), cy = Math.max(ay, Math.min(jy, ay + ah));
      if ((cx - o.x) ** 2 + (cy - jy) ** 2 < (o.r - 4) ** 2) return true;
    }
  }
  return false;
}

// ---------- drawing ----------
function bg() {
  const hue = (195 + t * 0.03) % 360;   // slowly color-shifting water
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, `hsl(${hue},65%,52%)`);
  g.addColorStop(1, `hsl(${(hue + 25) % 360},70%,24%)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // light rays
  ctx.save(); ctx.globalAlpha = 0.08; ctx.fillStyle = '#fff';
  for (let i = 0; i < 3; i++) {
    const rx = ((i * 320 - t * 0.4) % (W + 200) + W + 200) % (W + 200) - 100;
    ctx.beginPath(); ctx.moveTo(rx, -10); ctx.lineTo(rx + 90, -10);
    ctx.lineTo(rx + 30, H); ctx.lineTo(rx - 60, H); ctx.fill();
  }
  ctx.restore();

  // far seaweed silhouettes (parallax)
  ctx.save(); ctx.globalAlpha = 0.25; ctx.fillStyle = '#06283d';
  for (let i = 0; i < 6; i++) {
    const sx = ((i * 170 - t * speed * 0.25) % (W + 60) + W + 60) % (W + 60) - 30;
    const sw = 14, sh = 60 + (i % 3) * 22, sway = Math.sin(t / 30 + i) * 6;
    ctx.beginPath();
    ctx.moveTo(sx, GROUND + 14);
    ctx.quadraticCurveTo(sx + sway, GROUND - sh / 2, sx + sway * 1.6, GROUND - sh + 14);
    ctx.quadraticCurveTo(sx + sw + sway, GROUND - sh / 2, sx + sw, GROUND + 14);
    ctx.fill();
  }
  ctx.restore();

  // sand
  ctx.fillStyle = '#e8cf9d'; ctx.fillRect(0, GROUND, W, H - GROUND);
  ctx.fillStyle = '#d9bd85';
  for (let i = 0; i < 14; i++) {
    const px = ((i * 73 - t * speed) % (W + 20) + W + 20) % (W + 20) - 10;
    ctx.fillRect(px, GROUND + 12 + (i % 4) * 8, 8, 3);
  }
}

function drawBubbles() {
  if (t % 9 === 0) bubbles.push({ x: Math.random() * W, y: H + 6, r: 2 + Math.random() * 4, v: 0.6 + Math.random() });
  ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,.5)';
  bubbles = bubbles.filter(b => b.y + b.r > -4);
  for (const b of bubbles) {
    b.y -= b.v; b.x += Math.sin(b.y / 22) * 0.4;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.stroke();
  }
  ctx.restore();
}

function drawAxo() {
  const grounded = axo.y >= GROUND - 0.5;
  const wig = Math.sin(t / 3.2) * (grounded && mode === 'play' ? 1 : 0.4);
  const x = axo.x, y = axo.y;
  ctx.save(); ctx.translate(x, y);

  // tail (behind body, wagging)
  ctx.save(); ctx.translate(-34, -16); ctx.rotate(wig * 0.18);
  ctx.fillStyle = '#ff9fbe';
  ctx.beginPath(); ctx.moveTo(0, -8);
  ctx.quadraticCurveTo(-30, -20 + wig * 4, -40, 0 + wig * 3);
  ctx.quadraticCurveTo(-30, 14 + wig * 3, 0, 8); ctx.fill();
  ctx.restore();

  // back leg
  leg(-16, 0, wig * 8);
  // body capsule
  ctx.fillStyle = '#ffb1c8';
  rr(-36, -30, 62, 30, 14);
  // belly
  ctx.fillStyle = '#ffd4e0';
  rr(-30, -14, 48, 12, 6);
  // head
  ctx.fillStyle = '#ffb1c8';
  ctx.beginPath(); ctx.arc(30, -18, 21, 0, 7); ctx.fill();
  // gills — three fronds, wiggling
  ctx.fillStyle = '#ff5c8a';
  for (const [ang, len] of [[-1.9, 16], [-2.5, 18], [-3.1, 15]]) {
    ctx.save(); ctx.translate(18, -30); ctx.rotate(ang + wig * 0.08);
    ctx.beginPath(); ctx.ellipse(len / 2 + 4, 0, len / 2 + 4, 4.5, 0, 0, 7); ctx.fill();
    ctx.restore();
  }
  // front leg
  leg(16, 0, -wig * 8);
  // eye + glint
  ctx.fillStyle = '#2b2b3a';
  ctx.beginPath(); ctx.arc(37, -21, 4.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(38.6, -22.6, 1.6, 0, 7); ctx.fill();
  // blush
  ctx.fillStyle = 'rgba(255,110,150,.55)';
  ctx.beginPath(); ctx.ellipse(41, -12, 5, 3, 0, 0, 7); ctx.fill();
  // smile
  ctx.strokeStyle = '#c2557d'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(44, -15, 5, 0.3, 1.6); ctx.stroke();
  ctx.restore();

  function leg(lx, ly, swing) {
    ctx.save(); ctx.translate(lx, ly - 4); ctx.rotate(swing * 0.03);
    ctx.fillStyle = '#ff9fbe'; rr(-4, 0, 9, 10, 4); ctx.restore();
  }
  function rr(a, b, w2, h2, r) { ctx.beginPath(); ctx.roundRect(a, b, w2, h2, r); ctx.fill(); }
}

function drawObstacles() {
  for (const o of obstacles) {
    if (o.kind === 'coral') {
      ctx.save(); ctx.translate(o.x, o.y);
      const n = 3 + Math.floor(o.w / 18);
      for (let i = 0; i < n; i++) {
        const bx = -o.w / 2 + (i + 0.5) * (o.w / n);
        const bh = o.h * (0.6 + 0.4 * Math.sin(i * 2.7 + o.x));
        ctx.fillStyle = i % 2 ? o.hue : '#ff9a76';
        ctx.beginPath(); ctx.roundRect(bx - 5, -bh, 10, bh, 5); ctx.fill();
        ctx.beginPath(); ctx.arc(bx, -bh, 6, 0, 7); ctx.fill();
      }
      ctx.restore();
    } else {
      const jy = o.y + Math.sin(t / 14 + o.bob) * 8;
      ctx.save(); ctx.translate(o.x, jy);
      ctx.fillStyle = 'rgba(190,150,255,.85)';
      ctx.beginPath(); ctx.arc(0, 0, o.r, Math.PI, 0);
      ctx.quadraticCurveTo(o.r, o.r * 0.5, o.r * 0.8, o.r * 0.55);
      for (let i = 3; i >= -3; i--) ctx.lineTo(i * o.r / 4, o.r * (i % 2 ? 0.35 : 0.55));
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = 'rgba(190,150,255,.6)'; ctx.lineWidth = 2;
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.moveTo(i * 8, o.r * 0.5);
        ctx.quadraticCurveTo(i * 8 + Math.sin(t / 8) * 5, o.r + 10, i * 8, o.r + 20);
        ctx.stroke();
      }
      ctx.fillStyle = '#2b2b3a';
      ctx.beginPath(); ctx.arc(-6, -4, 2.2, 0, 7); ctx.arc(6, -4, 2.2, 0, 7); ctx.fill();
      ctx.restore();
    }
  }
}

function ui() {
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.font = '600 16px "Segoe UI", sans-serif'; ctx.textAlign = 'right';
  ctx.fillText(`score ${score}`, W - 18, 30);
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  ctx.fillText(`best ${best}`, W - 18, 52);
  ctx.textAlign = 'center';
  if (mode === 'start') {
    panel('🌊  axolotl run  🌊', 'space or tap to swim — dodge coral, duck jellyfish');
  } else if (mode === 'dead') {
    panel(`swept away! score ${score}`, score >= best && score > 0 ? 'new best!! 🩷 — space to go again' : 'space or tap to try again');
  }
  function panel(a, b) {
    ctx.fillStyle = 'rgba(6,24,40,.72)'; ctx.beginPath();
    ctx.roundRect(W / 2 - 240, 92, 480, 92, 16); ctx.fill();
    ctx.fillStyle = '#ffd4e0'; ctx.font = '700 24px "Segoe UI", sans-serif';
    ctx.fillText(a, W / 2, 130);
    ctx.fillStyle = '#bfe3ff'; ctx.font = '500 14px "Segoe UI", sans-serif';
    ctx.fillText(b, W / 2, 160);
  }
}

// ---------- loop ----------
function step() {
  t++;
  bg(); drawBubbles();

  if (mode === 'play') {
    speed = Math.min(9.5, speed + 0.0008);
    dist += speed; score = Math.floor(dist / 10);

    axo.vy += 0.55; axo.y = Math.min(GROUND, axo.y + axo.vy);
    if (axo.y >= GROUND) axo.vy = 0;

    if (--nextSpawn <= 0) spawn();
    for (const o of obstacles) o.x -= speed;
    obstacles = obstacles.filter(o => o.x > -80);

    if (hit()) {
      mode = 'dead';
      if (score > best) { best = score; try { localStorage.setItem('axo-best', best); } catch(e) {} }
    }
  }

  drawObstacles(); drawAxo(); ui();
  requestAnimationFrame(step);
}
step();
})();
</script>
</body>
</html>
